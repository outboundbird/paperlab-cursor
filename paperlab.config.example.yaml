# paperlab.config.yaml — per-machine paths for the PaperLab agents.
#
# Copy this file to `paperlab.config.yaml` (git-ignored) and edit the paths
# for your machine. Every PaperLab subagent reads this file first to resolve
# where to read PDFs/upstream code from and where to write generated notes to.

# Absolute path to the paperlab-cursor repo root on this machine.
# Used to build absolute links from vault notes back to the repo-side PDF and
# upstream code.
repo_root: "C:/Users/<your-user>/Workspace/paperlab-cursor"

# Absolute path to the PaperLab subtree inside your Obsidian vault. Each paper
# gets a flat folder at <vault_paperlab_path>/<slug>/ containing all
# agent-generated markdown, slides, diagrams, and tldraw canvases.
#
# IMPORTANT (Windows): keep this path ASCII. No emoji, no other non-BMP
# characters (anything outside U+0000..U+FFFF). Such characters round-trip
# badly through Windows shells (cmd.exe cp1252) and Cursor's tool-call
# layer, causing the Tutor and other agents to hang or fail file-exists
# checks. Spaces are tolerated but discouraged. Folders elsewhere in your
# vault (siblings, ancestors above PaperLab/, children inside per-paper
# folders) may contain emoji — only the segment up to and including
# `PaperLab/` itself must be clean. macOS and Linux are unaffected.
vault_paperlab_path: "C:/Users/<your-user>/path/to/Obsidian/Vault/.../PaperLab"

# (Optional) Absolute path to the root of your curated Obsidian vault. The
# `prerequisite` and `explainer` agents may read from here to check whether you
# have prior notes on assumed concepts. Read-only.
obsidian_vault_root: "C:/Users/<your-user>/path/to/Obsidian/Vault"

# (Optional) Per-machine timeouts in seconds for the coder's smoke gates.
# These are PER-MACHINE because the same synthetic-input run takes seconds
# on a workstation but several minutes on a low-RAM CPU-only laptop. Bump
# both values on slow hardware; the coder treats timeout as FAIL, not skip.
#
# Defaults (used if this key or its subkeys are omitted) assume a
# workstation-class machine:
#   stage1 = 30   # `python test_invariants.py` (Stage 1 hop-2 guard)
#   stage2 = 60   # `python run.py --smoke`     (Stage 2 end-to-end smoke)
coder_smoke_timeout:
  stage1: 30
  stage2: 60
